<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上海轨道交通远期规划图</title>
  <meta name="description" content="上海轨道交通远期线网规划交互图：线路走向、设站与换乘节点、分段建设状态（既有 / 已批复 / 远期），数据纯手工录入。">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101216'/%3E%3Cpath d='M16 2v8M16 22v8M2 16h8M22 16h8' stroke='%234c8dff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
  <style>
    /* 阶段 3 查看器：白板画布（2026-11-22 三批改版，黑板→白；面板等 UI 镀层保持深色），
       默认无底图、不引用任何外部数据源；2026-11-22 测试阶段豁免：可选 OSM/高德底图，
       默认关闭时行为与零外部资源现状完全一致 */
    :root {
      --bg: #ffffff;
      --panel: rgba(23, 26, 32, 0.92);
      --panel-border: #2a2f3a;
      --text: #e8eaf0;
      --text-dim: #9aa3b2;
      --accent: #4c8dff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body { font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: var(--text); overflow: hidden; }

    #map { position: absolute; inset: 0; }

    /* HTML 中文标签叠加层（无 glyphs 备案路线：绝对定位 + project 定位 + rAF 合帧） */
    #labelLayer {
      position: absolute; inset: 0; overflow: hidden;
      pointer-events: none; z-index: 1;
    }
    /* 2026-11-22 三批改版：白板底→黑字＋白色外描边（paint-order:stroke fill 先描后填＝
       描边只露外侧；宽度＝字号 1/4（居中描边被填充盖掉一半）→ 可见外扩＝字号 1/8，
       用户例：24pt 字加 3pt 白边）；transform-origin 与 translate(-50%,-140%) 同参考点
       （＝站点）——z<11 等比缩放时文字朝站点收拢，不再以自身中点缩放导致上浮漂移 */
    .map-label {
      position: absolute; left: 0; top: 0;
      font-size: 12px; line-height: 1.2; color: #000;
      white-space: nowrap; pointer-events: none; will-change: transform;
      paint-order: stroke fill;
      -webkit-text-stroke: 3px #fff;
      transform-origin: 50% 140%;
    }
    .map-label.is-group {
      font-size: 13px; font-weight: 600; color: #000;
      -webkit-text-stroke: 3.25px #fff;
    }

    /* 顶栏：标题 + 搜索 + 「突出既有」开关 */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; gap: 14px;
      padding: 8px 12px;
      background: var(--panel); border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(6px);
    }
    #brand { font-weight: 600; white-space: nowrap; }
    #brand small { color: var(--text-dim); font-weight: 400; margin-left: 6px; }
    #searchWrap { position: relative; flex: 0 1 360px; min-width: 200px; }
    #searchInput {
      width: 100%; padding: 6px 10px;
      background: #0d0f13; color: var(--text);
      border: 1px solid var(--panel-border); border-radius: 6px; outline: none;
    }
    #searchInput:focus { border-color: var(--accent); }
    /* 顶栏三按钮共用样式（2026-11-22 改版）：分期四档循环 / 全局站名开关 / 测试阶段底图 */
    #btnPhase, #btnNames, #btnBasemap {
      flex: none; padding: 6px 10px; cursor: pointer; white-space: nowrap;
      background: #0d0f13; color: var(--text);
      border: 1px solid var(--panel-border); border-radius: 6px;
    }
    #btnPhase:hover, #btnNames:hover, #btnBasemap:hover { border-color: var(--accent); color: #fff; }
    #searchDrop {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      margin: 0; padding: 4px 0; list-style: none;
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
      max-height: 320px; overflow: auto; z-index: 11;
    }
    #searchDrop li {
      display: flex; align-items: baseline; gap: 8px;
      padding: 5px 10px; cursor: pointer;
    }
    #searchDrop li.active, #searchDrop li:hover { background: #232833; }
    .drop-main { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drop-sub { flex: 1; color: var(--text-dim); font-size: 12px; text-align: right; }

    /* 左：线路列表面板（按线路分类分组） */
    #linePanel {
      position: absolute; top: 56px; left: 12px; bottom: 12px; width: 236px; z-index: 10;
      display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
      backdrop-filter: blur(6px); overflow: hidden;
    }
    /* ⚠ hidden 坑（下方 legendPanel 注释同款）：#linePanel 的 display:flex 优先级高于 UA 样式表
       的 [hidden]{display:none}，直接设 hidden 属性藏不住——收起功能必须显式补这条才能生效；
       #linePanelTab 本身未设 display，一并防御免后人加 display 时踩坑 */
    #linePanel[hidden], #linePanelTab[hidden] { display: none; }
    /* 面板头改 flex：左标题＋右收起按钮（2026-11-22 用户需求：收起后左缘药丸代为展开） */
    #linePanel .panel-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 8px 8px 12px; font-weight: 600;
      border-bottom: 1px solid var(--panel-border); flex: none;
    }
    #linePanel .panel-title {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 收起按钮样式仿 #infoClose：无边框幽灵按钮、灰字 hover 变亮 */
    #linePanelCollapse {
      flex: none; border: none; background: none; color: var(--text-dim);
      font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
    }
    #linePanelCollapse:hover { color: var(--text); }
    #lineList { overflow: auto; padding: 4px 0; flex: 1; }
    .line-group { margin-bottom: 2px; }
    .line-group-head {
      padding: 4px 12px; font-size: 12px; color: var(--text-dim);
      cursor: pointer; user-select: none; letter-spacing: 1px;
    }
    .line-group-head:hover { color: var(--text); }
    .line-group.collapsed .line-item { display: none; }
    /* 2026-11-22 改版：复选框/多选高亮删除；双击行＝聚焦该线 */
    .line-item {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 12px; cursor: pointer; user-select: none;
    }
    .line-item:hover { background: #232833; }
    .line-item.focused { background: #24406b; }
    .line-item.display-only { opacity: 0.45; cursor: default; }   /* 他省线「仅显示」级：不可聚焦 */
    .line-swatch {
      flex: none; width: 14px; height: 4px; border-radius: 2px;
    }
    .line-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .line-chip {
      flex: none; font-size: 11px; color: var(--text-dim);
      padding: 0 5px; border: 1px solid var(--panel-border); border-radius: 8px;
    }
    .panel-tip { padding: 8px 12px; color: var(--text-dim); font-size: 12px; }

    /* 面板收起后的左缘「线路」半出药丸（2026-11-22 用户需求）：贴页面左缘垂直居中、
       右缘全圆角＝右半胶囊形态、左缘贴边故不设左边框；默认隐藏，收起时由 viewer.js 亮出。
       视觉基调与既有深色面板一致（--panel 底＋blur 磨砂） */
    #linePanelTab {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 10;
      writing-mode: vertical-rl; letter-spacing: 6px; font-weight: 600;
      color: var(--text-dim); cursor: pointer; user-select: none;
      background: var(--panel); border: 1px solid var(--panel-border); border-left: none;
      border-radius: 0 999px 999px 0;
      backdrop-filter: blur(6px); padding: 16px 7px;
    }
    #linePanelTab:hover { color: var(--text); }

    /* 右：信息面板（点线 / 点站 / 搜索选择） */
    #infoPanel {
      position: absolute; top: 56px; right: 12px; width: 300px; z-index: 10;
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
      backdrop-filter: blur(6px); overflow: hidden;
    }
    #infoHead {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--panel-border);
    }
    #infoTitle { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #infoClose {
      flex: none; border: none; background: none; color: var(--text-dim);
      font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
    }
    #infoClose:hover { color: var(--text); }
    #infoBody { padding: 8px 12px 12px; }
    .info-row { display: flex; gap: 10px; padding: 3px 0; }
    .info-key { flex: none; width: 62px; color: var(--text-dim); }
    .info-val { flex: 1; word-break: break-all; }
    .info-actions { display: flex; gap: 8px; margin-top: 10px; }
    .info-actions button {
      flex: 1; padding: 5px 0; cursor: pointer;
      background: #0d0f13; color: var(--text);
      border: 1px solid var(--panel-border); border-radius: 6px;
    }
    .info-actions button:hover { border-color: var(--accent); color: #fff; }

    /* 中央提示（加载中 / 暂无数据 / 加载失败） */
    #centerMsg {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 20; text-align: center; pointer-events: none;
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 18px 26px; max-width: 70%;
    }
    #centerMsgText { font-size: 16px; font-weight: 600; }
    #centerMsgDetail { margin-top: 6px; color: var(--text-dim); font-size: 13px; }

    /* 左下：图例卡（2026-11-22 改版：三档线样说明与「突出既有」开关退役，只剩测试阶段
       底图署名行；无底图时整卡由 viewer.js 隐藏）。不设 display 属性保证 [hidden] 生效。 */
    #legendPanel {
      position: absolute; left: 12px; bottom: 12px; z-index: 10;
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
      backdrop-filter: blur(6px); padding: 8px 12px;
    }
    /* 测试阶段底图署名（attributionControl:false，此行即署名载体；无底图时隐藏）——
       恒在左下、与右下 NavigationControl 天然不重叠。 */
    #basemapAttr {
      color: var(--text-dim); font-size: 11px; white-space: nowrap;
    }

    /* 屏幕下方居中：聚焦线路信息框（2026-11-22 改版；占位内容，用户稍后定） */
    #focusBox {
      position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
      z-index: 10; min-width: 260px; max-width: min(480px, calc(100vw - 24px));
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
      backdrop-filter: blur(6px); overflow: hidden;
    }
    #focusHead {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--panel-border);
    }
    #focusTitle { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #focusClose {
      flex: none; border: none; background: none; color: var(--text-dim);
      font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
    }
    #focusClose:hover { color: var(--text); }
    #focusBody { padding: 8px 12px; }
    #focusTip {
      padding: 4px 12px 8px; color: var(--text-dim); font-size: 11px;
    }

    /* 站点 hover 提示（浮于图例之上、面板之下） */
    #stopTip {
      position: absolute; z-index: 9; max-width: 260px;
      transform: translateY(-100%);
      background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
      padding: 5px 9px; pointer-events: none;
    }
    #stopTipName { font-weight: 600; }
    #stopTipSub { color: var(--text-dim); font-size: 12px; }

    @media (max-width: 720px) {
      #brand small { display: none; }
      #linePanel { width: 190px; }
      #infoPanel { width: calc(100vw - 24px); }
      #legendPanel { padding: 8px 10px 6px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="labelLayer"></div>

  <header id="topbar">
    <div id="brand">上海轨道交通远期规划图<small>查看器</small></div>
    <div id="searchWrap">
      <input id="searchInput" type="text" placeholder="搜索线路或车站…" autocomplete="off" spellcheck="false">
      <ul id="searchDrop" hidden></ul>
    </div>
    <!-- 2026-11-22 改版：分期四档循环（无＝全部正常；非「无」档＝选中期次的线路正常显示、
         其他线路半透明并隐去站名）＋全局站名开关（隐藏时一切站名不显示，优先级最高）。不持久化。 -->
    <button id="btnPhase" type="button"
      title="分期四档循环：无 → 既有 → 已批复 → 远期 → 无。「无」＝全部正常显示；非「无」档＝选中期次的线路正常显示，其他线路半透明并隐去站名（站圈符号保留）。">分期：无</button>
    <button id="btnNames" type="button"
      title="全局站名开关：显示 ⇄ 隐藏。隐藏时一切站名不显示（优先级最高），站圈符号保留。">站名：显示</button>
    <!-- 测试阶段功能（正式上线可能移除）：底图三态循环。默认「无」＝零外部资源、零网络请求；
         高德为 GCJ02，仅显示坐标做偏移对齐，数据与导出仍为 WGS84。状态不持久化。 -->
    <button id="btnBasemap" type="button"
      title="测试阶段功能（正式上线可能移除）：底图三态 无→OSM→高德 循环，仅显示对位参考；默认无底图＝零外部资源、零网络请求；高德（GCJ02）仅显示坐标做偏移对齐，数据与导出仍为 WGS84。瓦片 100% 不透明＋40% 白色遮罩（2026-11-22 定值）。">底图：无</button>
  </header>

  <aside id="linePanel">
    <!-- 2026-11-22 用户需求：面板头加收起按钮，收起后由左缘「线路」药丸（#linePanelTab）代为展开 -->
    <div class="panel-head">
      <div class="panel-title">线路</div>
      <button id="linePanelCollapse" title="收起线路面板">«</button>
    </div>
    <div id="lineList"></div>
  </aside>

  <!-- 收起态左缘半出药丸（默认隐藏；点击恢复线路面板，接线在 viewer.js wireUI） -->
  <div id="linePanelTab" hidden title="展开线路面板">线路</div>

  <aside id="infoPanel" hidden>
    <div id="infoHead">
      <div id="infoTitle"></div>
      <button id="infoClose" title="关闭">×</button>
    </div>
    <div id="infoBody"></div>
  </aside>

  <div id="centerMsg" hidden>
    <div id="centerMsgText"></div>
    <div id="centerMsgDetail"></div>
  </div>

  <!-- 2026-11-22 改版：三档线样说明与「突出既有」开关退役（渲染已不区分期次），
       图例卡只剩测试阶段底图署名行；无底图时整卡隐藏（viewer.js 控制）。 -->
  <aside id="legendPanel" aria-label="底图署名" hidden>
    <div id="basemapAttr" hidden title="测试阶段底图署名（无底图时隐藏）"></div>
  </aside>

  <!-- 聚焦线路信息框（屏幕下方居中；占位内容，用户稍后定） -->
  <div id="focusBox" hidden>
    <div id="focusHead">
      <div id="focusTitle"></div>
      <button id="focusClose" title="退出聚焦（或按 Esc）" type="button">×</button>
    </div>
    <div id="focusBody"></div>
    <div id="focusTip">双击左栏同一行或按 Esc 退出聚焦</div>
  </div>

  <div id="stopTip" hidden>
    <div id="stopTipName"></div>
    <div id="stopTipSub"></div>
  </div>

  <noscript><p style="padding:2em">本页需要启用 JavaScript 才能显示地图。</p></noscript>

  <!-- 本地预览（数据为相对路径，按 net → build/net 依次回退）：
       ① python -X utf8 tools/flatten.py --data data --out build/net
       ② python -X utf8 tools/serve.py  →  http://localhost:8000/index.html
       正式发布：python -X utf8 tools/publish.py 生成 docs/ 快照（含 net/，GitHub Pages 项目页相对路径不破）。 -->

  <script src="assets/vendor/maplibre-gl.js"></script>
  <script src="src/viewer_core.js"></script>
  <script src="src/viewer.js"></script>
</body>
</html>
